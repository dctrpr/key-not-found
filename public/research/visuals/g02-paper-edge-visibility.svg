<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="visual-frame-title visual-frame-description"><title id="visual-frame-title">Pages 78/79 show trim on both axes.</title><desc id="visual-frame-description">21 Agreed trim crossings; 1 Disagreed crossings; 2 Agreed corners. Both faces of 78/79 show agreed bottom and outer edges. Pages 76/77 show the bottom edge on both faces. Their outer edges remain unresolved. A separate calibration study is needed.</desc><rect width="900" height="440" fill="#0e0e0d"></rect><g font-family="Arial, sans-serif"><rect x="35" y="31" width="8" height="8" fill="#d6ff3c"></rect><text x="54" y="39" fill="#f4f1e8" font-size="11" letter-spacing="2">KEY NOT FOUND / RESEARCH FRAME 23</text><text x="865" y="39" text-anchor="end" fill="#aaa79d" font-size="11">2026-11-10 · UNSOLVED</text><text x="40" y="101" fill="#f4f1e8" font-size="26" font-weight="700">Pages 78/79 show trim on both axes.</text><text x="40" y="130" fill="#aaa79d" font-size="13">Native photographs → independent marks → agreed crossings</text><g><rect x="40" y="190" width="244" height="132" rx="1" fill="#191917" stroke="#45453c"></rect><text x="61" y="251" fill="#f4f1e8" font-size="49" font-weight="700" letter-spacing="-2">21</text><text x="62" y="288" fill="#aaa79d" font-size="13">Agreed trim crossings</text><path d="M 294 256 h 18 m -5 -5 l 5 5 -5 5" stroke="#aaa79d" fill="none"></path></g><g><rect x="328" y="190" width="244" height="132" rx="1" fill="#191917" stroke="#45453c"></rect><text x="349" y="251" fill="#f4f1e8" font-size="49" font-weight="700" letter-spacing="-2">1</text><text x="350" y="288" fill="#aaa79d" font-size="13">Disagreed crossings</text><path d="M 582 256 h 18 m -5 -5 l 5 5 -5 5" stroke="#aaa79d" fill="none"></path></g><g><rect x="616" y="190" width="244" height="132" rx="1" fill="#d6ff3c" stroke="#d6ff3c"></rect><text x="637" y="251" fill="#0e0e0d" font-size="49" font-weight="700" letter-spacing="-2">2</text><text x="638" y="288" fill="#30341e" font-size="13">Agreed corners</text></g><text x="40" y="350" fill="#f4f1e8" font-size="14">The marks locate visible paper edges in the photographs.</text><text x="40" y="375" fill="#aaa79d" font-size="12">Physical alignment still needs a separate measurement.</text><line x1="35" x2="865" y1="397" y2="397" stroke="#34342e"></line><text x="40" y="420" fill="#aaa79d" font-size="10">SOURCE 0c3ead316d98f0cb · 2026-11-10T23:34:48.813Z · SCHEMATIC</text><text x="860" y="420" text-anchor="end" fill="#f4f1e8" font-size="11">keynotfound.com</text></g></svg>
