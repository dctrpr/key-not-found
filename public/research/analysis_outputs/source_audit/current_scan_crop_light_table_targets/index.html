<!doctype html>
<html>
<head><meta charset="utf-8"><title>Crop Light Table Targets</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#10131a;color:#eee}
header{padding:16px 22px;background:#202838}
main{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:18px}
button{display:block;width:100%;margin:4px 0;padding:8px;border:0;background:#303a4f;color:#fff;text-align:left;cursor:pointer}
button:hover{background:#44536f} img{max-width:100%;height:auto;border:1px solid #333}
.meta{font-size:13px;color:#ccc}
</style></head>
<body><header><h1>Crop Light Table Targets</h1><div>O4/B4/G5/O5 crop panels from current scan/PDF held-to-light transforms.</div></header>
<main><section id="buttons"></section><section><h2 id="label"></h2><img id="view"><p id="meta" class="meta"></p></section></main>
<script>
const cards=[{"label": "valid_75_to_76_natural / O4", "src": "valid_75_to_76_natural_O4.jpg", "coverage": 0.12232334047109207, "jaccard": 0.12080323474626323, "decision": "weak source ink"}, {"label": "valid_75_to_76_natural / B4", "src": "valid_75_to_76_natural_B4.jpg", "coverage": 0.0, "jaccard": 0.0, "decision": "no meaningful source ink"}, {"label": "valid_75_to_76_natural / G5", "src": "valid_75_to_76_natural_G5.jpg", "coverage": 0.05262884455527847, "jaccard": 0.05919411996324977, "decision": "no meaningful source ink"}, {"label": "valid_75_to_76_natural / O5", "src": "valid_75_to_76_natural_O5.jpg", "coverage": 0.16541062801932366, "jaccard": 0.1695959595959596, "decision": "weak source ink"}, {"label": "valid_75_to_76_forced_best / O4", "src": "valid_75_to_76_forced_best_O4.jpg", "coverage": 0.9766238401142041, "jaccard": 0.9840623019107126, "decision": "heavy source ink"}, {"label": "valid_75_to_76_forced_best / B4", "src": "valid_75_to_76_forced_best_B4.jpg", "coverage": 0.1299247633686595, "jaccard": 0.11690496215306981, "decision": "weak source ink"}, {"label": "valid_75_to_76_forced_best / G5", "src": "valid_75_to_76_forced_best_G5.jpg", "coverage": 0.05403158769742311, "jaccard": 0.052059608251447904, "decision": "no meaningful source ink"}, {"label": "valid_75_to_76_forced_best / O5", "src": "valid_75_to_76_forced_best_O5.jpg", "coverage": 0.09990338164251207, "jaccard": 0.09627568636653146, "decision": "no meaningful source ink"}, {"label": "benchmark_79_to_76_natural / O4", "src": "benchmark_79_to_76_natural_O4.jpg", "coverage": 0.009145253390435404, "jaccard": 0.008934676573825044, "decision": "no meaningful source ink"}, {"label": "benchmark_79_to_76_natural / B4", "src": "benchmark_79_to_76_natural_B4.jpg", "coverage": 0.0713534503680932, "jaccard": 0.05162523900573614, "decision": "no meaningful source ink"}, {"label": "benchmark_79_to_76_natural / G5", "src": "benchmark_79_to_76_natural_G5.jpg", "coverage": 0.00015586034912718204, "jaccard": 0. const buttons=document.getElementById('buttons'), view=document.getElementById('view'), label=document.getElementById('label'), meta=document.getElementById('meta');
function show(i){const c=cards[i];view.src=c.src;label.textContent=c.label;meta.textContent=`coverage=${c.coverage.toFixed(4)}; jaccard=${c.jaccard.toFixed(4)}; ${c.decision}`;}
cards.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.label;b.onclick=()=>show(i);buttons.appendChild(b);});
show(0);
</script></body></html>
