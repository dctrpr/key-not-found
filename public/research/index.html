                <label style="margin-top: 10px;">2. Bolded Content (from PDF)</label>
                <textarea id="boldWords" placeholder="Enter FULL BOLDED WORDS here..." style="height: 60px; margin-bottom: 5px;"></textarea>
                <textarea id="boldLetters" placeholder="Enter INDIVIDUAL BOLDED LETTERS here (in order)..." style="height: 60px;"></textarea>
            </div>

            <div class="panel">
                <label>3. Transformation Strategies</label>
                <div class="controls">
                    <button onclick="transform('sand')">George Sand (Odd Lines)</button>
                    <button onclick="transform('sand_inv')">Sand Inverse (Even Lines)</button>
                    <button onclick="transform('mirror')">Mirror Text</button>
                    <button onclick="transform('first')">First Words</button>
                    <button onclick="transform('last')">Last Words</button>
                </div>
                <div class="controls">
                    <button onclick="transform('bold_letters')">Use Bolded Letters</button>
                    <button onclick="transform('mix_sand_bold')">Mix: Sand + Bold Words</button>
                    <button onclick="transform('mix_mirror_sand')">Mix: Mirror + Sand</button>
                </div>
                
                <label>Current Output / Candidate:</label>
                <div id="output"></div>
                
                <div class="controls" style="margin-top: 20px;">
                    <button class="primary" onclick="runAutomatedSolver()">RUN AUTOMATED SOLVER</button>
                    <button onclick="checkCurrentOutput()">Check Current Output as Key</button>
                </div>
                
                <label>Automation Log:</label>
                <div id="log" class="log-box"></div>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script>
        // Full BIP39 Wordlist (Partial for now, usually you'd load full list)
        // We'll rely on the backend to do strict validation, but frontend filtering helps.
        // To save space, I'm not pasting 2048 words here, but the logic will try to filter for "English-looking" words
        // or rely on the server which has the full library.
        
        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function getLines() {
            return document.getElementById('mainText').value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        }

        function getWords(text) {
            return text.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(w => w.length > 0);
        }

        function transform(type) {
            const text = document.getElementById('mainText').value;
            const boldWords = document.getElementById('boldWords').value;
            const boldLetters = document.getElementById('boldLetters').value;
            const lines = getLines();
            let result = "";

            switch(type) {
                case 'sand':
                    result = lines.filter((_, i) => i % 2 === 0).join(' ');
                    break;
                case 'sand_inv':
                    result = lines.filter((_, i) => i % 2 !== 0).join(' ');
                    break;
                case 'mirror':
                    result = text.split('').reverse().join('');
                    break;
                case 'first':
                    result = lines.map(l => l.split(' ')[0]).join(' ');
                    break;
                case 'last':
                    result = lines.map(l => l.split(' ').pop()).join(' ');
                    break;
                case 'bold_letters':
                    result = boldLetters;
                    break;
                case 'mix_sand_bold':
                    // Logic: Take Sand words, then append Bold words to see if they complete a phrase
                    const sand = lines.filter((_, i) => i % 2 === 0).join(' ');
                    result = sand + " " + boldWords;
                    break;
                case 'mix_mirror_sand':
                    const reversedLines = [...lines].reverse();
                    result = reversedLines.filter((_, i) => i % 2 === 0).join(' ');
                    break;
            }
            
            document.getElementById('output').innerText = result;
        }

        async function checkCurrentOutput() {
            const text = document.getElementById('output').innerText;
            const words = getWords(text);
            const candidates = [];
            
            // Generate candidates from current text (sliding window)
            if (words.length >= 12) {
                for (let len of [12, 24]) {
                     for (let i = 0; i <= words.length - len; i++) {
                        candidates.push(words.slice(i, i + len).join(' '));
                    }
                }
            }
            
            if (candidates.length === 0) {
                log("Text too short or invalid for seed phrase.");
                return;
            }
            
            log(`Checking ${candidates.length} candidates from current output...`);
            await sendCandidates(candidates);
        }

        async function runAutomatedSolver() {
            log("Starting Full Automation...");
            const text = document.getElementById('mainText').value;
            const boldW = document.getElementById('boldWords').value;
            const boldL = document.getElementById('boldLetters').value;
            const lines = getLines();
            const allWords = getWords(text);
            
            let candidates = new Set();

            // 1. Add pure bold text candidates
            if (boldW) {
                const words = getWords(boldW);
                if (words.length >= 12) candidates.add(words.join(' '));
            }
            
            // Check if bold letters form a key directly (WIF)
            if (boldL && boldL.length > 30) {
                candidates.add(boldL.replace(/\s/g, '')); // Try as WIF/Hex
            }

            // 2. Strategies
            const strategies = [
                lines.filter((_, i) => i % 2 === 0).join(' '), // Sand
                lines.filter((_, i) => i % 2 !== 0).join(' '), // Sand Inv
                [...lines].reverse().filter((_, i) => i % 2 === 0).join(' '), // Mirror Sand
                allWords.filter((_, i) => i % 2 === 0).join(' '), // Every 2nd word
                allWords.filter((_, i) => i % 3 === 0).join(' '), // Every 3rd word
                allWords.filter((_, i) => i % 4 === 0).join(' '), // Every 4th word
                allWords.filter((_, i) => i % 5 === 0).join(' '), // Every 5th word
            ];

            strategies.forEach(stratText => {
                const StratWords = getWords(stratText);
                if (StratWords.length >= 12) {
                    // Sliding windows
                    for (let len of [12, 24]) {
                        for (let i = 0; i <= StratWords.length - len; i++) {
                            candidates.add(StratWords.slice(i, i + len).join(' '));
                        }
                    }
                    // 13 words (remove 1)
                     if (StratWords.length === 13) {
                        for (let i = 0; i < 13; i++) {
                            const copy = [...StratWords];
                            copy.splice(i, 1);
                            candidates.add(copy.join(' '));
                        }
                    }
                }
            });

            log(`Generated ${candidates.size} unique candidates. Sending to server...`);
            
            const candidateArray = Array.from(candidates);
            await sendCandidates(candidateArray);
        }

        async function sendCandidates(list) {
            try {
                const response = await fetch('/check-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ candidates: list })
                });
                
                const data = await response.json();
                
                let msg = `Checked: ${data.stats.totalReceived} candidates.<br>`;
                msg += `Valid BIP39: ${data.stats.mnemonicsChecked} | Valid WIF: ${data.stats.wifsChecked}`;
                log(msg);

                if (data.results && data.results.length > 0) {
                    log(`SUCCESS! Found ${data.results.length} keys with activity!`);
                    const resultsDiv = document.getElementById('results');
                    data.results.forEach(res => {
                        resultsDiv.innerHTML += `<div class="valid-key">FOUND FUNDS (${res.type})!<br>Key: ${res.phrase}<br>Address: ${res.address}<br>Balance: ${res.balance}<br>Total Received: ${res.received}</div>`;
                    });
                } else {
                    if (data.stats.mnemonicsChecked === 0 && data.stats.wifsChecked === 0) {
                        log("WARNING: No valid key formats found. Check your text input or try 'Bold' clues.");
                    } else {
                        log("Done. Valid keys checked, but empty balances.");
                    }
                }
            } catch (e) {
                log("Error connecting to server: " + e.message);
            }
        }
    </script>
</body>
